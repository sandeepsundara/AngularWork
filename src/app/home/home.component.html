<section class="container" [ngClass] = "{'form-shodow' : registrationForm.dirty}">
    <header>Registration Form</header>
  
    <form class="form" (ngSubmit) = "onFormSubmit(registrationForm)" #registrationForm="ngForm">
      <div class="column">
        <div class="input-box">
          <input name="sandeep" type="text" placeholder="First Name"  ngModel/>
        </div> 
  
        <div class="input-box">
          <input  name="sandeep1" type="text" placeholder="Last Name" ngModel/>
        </div>
      </div>    
  
      <div class="input-box">
        <input type="text" placeholder="Email" name="sandeep2"  ngModel />
      </div>
  
      <div class="column">
        <div class="input-box">
          <input type="number" placeholder="Phone Number" name="phno" ngModel />
        </div>
        <div class="input-box">
          <input type="date" placeholder="Date of Birth" name="DOB" ngModel />
        </div>
      </div>
  
      <div class="input-box">
        <input type="text" placeholder="username" name="user" ngModel/>
        <button class="btn-gen-username">
          Create a Username
        </button>
      </div>
  
      <div class="gender-box">
        <h3>Gender</h3>
        <div class="gender-option">
          <div class="gender">
            <input type="radio" id="check-male" name="gender"  checked ngModel/>
            <label for="check-male">male</label>
          </div>
          <div class="gender">
            <input type="radio" id="check-female" name="gender" ngModel />
            <label for="check-female">Female</label>
          </div>
          <div class="gender">
            <input type="radio" id="check-other" name="gender" ngModel />
            <label for="check-other">prefer not to say</label>
          </div>
        </div>
      </div>
  
      <div class="input-box address">
        <label>Address</label>
        <input type="text" ngModel name="add" placeholder="Street address" />
        <input type="text" ngModel name="add2" placeholder="Street address line 2" />
        <div class="column">
          <div class="select-box">
            <select name="country" ngModel>
              <option hidden>Country</option>
              <option>America</option>
              <option>Japan</option>
              <option>India</option>
              <option>Nepal</option>
            </select>
          </div>
          <input type="text" name="city"  ngModel placeholder="City" />
        </div>
        <div class="column">
          <input type="text" name="Region" ngModel placeholder="Region" />
          <input type="number" name="postal" ngModel placeholder="Postal code" />
        </div>
      </div>
      <input type="submit" value="Submit" class="submit-btn"> 
    </form>
  </section>
